[package]
name = "gol_engines"
version = "0.3.1"
edition = "2024"
description = "Tools for Conway's Game of Life"
repository = "https://github.com/das67333/gol_engines"
readme = "README.md"
authors = ["Suleiman Kazimov <solomon67334@gmail.com>"]
license = "GPL-3.0"
keywords = ["game-of-life", "simd", "hashlife", "streamlife"]
categories = ["algorithms", "concurrency", "simulation"]
include = ["src/**/*.rs", "Cargo.toml", "README.md", "LICENSE", "LICENSES/*.txt"]

[features]
# Gather and print per-thread runtime statistics.
# Opt in with `--features statistics`; otherwise the recording/printing code paths are eliminated entirely.
statistics = []
cli_deps = ["chrono", "clap", "num-format", "dep:ctrlc", "dep:serde", "dep:serde_json", "dep:sha2", "dep:tempfile"]
# default = ["statistics"]

[[bin]]
name = "gol_engines_cli"
required-features = ["cli_deps"]

[[bin]]
name = "bench_0e0p"

[[bin]]
name = "bench_dev"

[dependencies]
ahash = "0.8"
anyhow = "1.0"
crossbeam = "0.8"
flate2 = "1.1"
mimalloc = "0.1"
num-bigint = "0.4"
rand = "0.9"
rand_chacha = "0.9"
smallvec = "1.15"

chrono = { version = "0.4", optional = true }
ctrlc = { version = "3.5", features = ["termination"], optional = true }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
sha2 = { version = "0.10", optional = true }
tempfile = { version = "3", optional = true }
clap = { version = "4.5", features = ["derive"], optional = true }
num-format = { version = "0.4", features = [
    "with-num-bigint",
], optional = true }

[profile.release]
panic = "abort"
lto = true
codegen-units = 1
strip = true

[dev-dependencies]
criterion = "0.7"
libc = "0.2"

[[bench]]
name = "channel_throughput"
harness = false

[[bench]]
name = "measure_duration"
harness = false

[[bench]]
name = "atomic_operations"
harness = false
